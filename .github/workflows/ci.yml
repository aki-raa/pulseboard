name: PulseBoard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build, Test and Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - location-service
          - chat-service
          - alert-service

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MYSQL_DATABASE: pulseboard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ secrets.CI_DB_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/pulseboard
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: mvn clean verify -DskipTests=false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:latest \
            -t ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:latest
          docker push ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:${{ github.sha }}
