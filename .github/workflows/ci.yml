name: PulseBoard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, Test and Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - location-service
          - chat-service
          - alert-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn clean verify -DskipTests=false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:latest \
            -t ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:latest
          docker push ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:${{ github.sha }}
