name: PulseBoard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build, Test and Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - location-service
          - chat-service
          - alert-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start MySQL
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          docker run -d \
            --name pulseboard-mysql \
            -e MYSQL_ROOT_PASSWORD="$CI_DB_PASSWORD" \
            -e MYSQL_DATABASE=pulseboard \
            -p 3306:3306 \
            mysql:8.4

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker exec pulseboard-mysql \
              mysqladmin ping -h 127.0.0.1 -uroot -p"$CI_DB_PASSWORD" --silent; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL failed to become ready."
          docker logs pulseboard-mysql
          exit 1
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      - name: Build and test
        working-directory: ${{ matrix.service }}
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/pulseboard
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: ./mvnw clean verify -DskipTests=false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:latest \
            -t ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:latest
          docker push ghcr.io/aki-raa/pulseboard-${{ matrix.service }}:${{ github.sha }}

      - name: Clean up MySQL
        if: always()
        run: |
          docker rm -f pulseboard-mysql || true
